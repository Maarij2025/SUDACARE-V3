name: SUDACARE Admin Upgrade
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  upgrade:
    if: "!contains(github.event.head_commit.message, '[admin-upgrade]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Upgrade admin dashboard
        run: |
          python3 tools/enhance_admin.py
          node --check server.js
          python3 - <<'PY'
          import re
          from pathlib import Path
          s=Path('public/index.html').read_text()
          js=re.findall(r'<script>(.*?)</script>',s,re.S)[-1]
          Path('/tmp/index-check.js').write_text(js)
          PY
          node --check /tmp/index-check.js
      - name: Commit upgrade
        run: |
          git config user.name 'SUDACARE Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add server.js public/index.html tools/enhance_admin.py
          git diff --cached --quiet || git commit -m 'Complete admin dashboard [admin-upgrade]'
          git push
